# --- Common ---
spring.application.name=manga-reader-backend

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:manga_reader}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change-me-locally}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# --- Jikan integration ---
jikan.base-url=${JIKAN_BASE_URL:https://api.jikan.moe/v4}
jikan.connect-timeout-ms=${JIKAN_CONNECT_TIMEOUT_MS:3000}
jikan.read-timeout-ms=${JIKAN_READ_TIMEOUT_MS:5000}
jikan.cache-ttl-seconds=${JIKAN_CACHE_TTL_SECONDS:3600}
jikan.genre-cache-ttl-seconds=${JIKAN_GENRE_CACHE_TTL_SECONDS:86400}
jikan.max-request-per-minute=${JIKAN_MAX_REQUESTS_PER_MINUTE:30}
jikan.retry-max-attempts=${JIKAN_RETRY_MAX_ATTEMPTS:2}

# --- JWT auth (SECRET WAJIB diganti di lingkungan nyata; minimal 256 bit) ---
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.allow-insecure-dev-secret=${APP_JWT_ALLOW_INSECURE_DEV_SECRET:false}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:720}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Logging ---
logging.level.com.example.mangareader=INFO

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
